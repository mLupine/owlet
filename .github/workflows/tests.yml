name: Integration tests
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11.16'
            lock: requirements-test-2024-1.lock
          - python: '3.13.15'
            lock: requirements-test-min.lock
          - python: '3.14.5'
            lock: requirements-test.lock
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
      - run: uv venv
      - run: uv pip sync --require-hashes "${{ matrix.lock }}"
      - run: .venv/bin/python -m pytest
      - if: matrix.python == '3.14.5'
        run: .venv/bin/ruff check custom_components tests scripts
      - if: matrix.python == '3.14.5'
        run: .venv/bin/ruff format --check custom_components tests scripts
      - run: .venv/bin/python scripts/build_release.py
