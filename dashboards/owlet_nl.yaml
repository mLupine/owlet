title: Owlet

views:
  - title: Baby
    path: baby
    icon: mdi:baby-face-outline
    type: sections
    max_columns: 2

    sections:

      - type: grid
        cards:
          - type: heading
            heading: Baby
            icon: mdi:baby-face-outline
            badges:
              - type: entity
                entity: sensor.owlet_sock_serial_number_slaaptoestand
                icon: mdi:sleep
                show_state: true
                color: state

              - type: entity
                entity: sensor.owlet_sock_serial_number_batterijniveau
                icon: mdi:battery
                show_state: true
                color: state

              - type: entity
                entity: sensor.owlet_sock_serial_number_huidtemperatuur
                icon: mdi:thermometer
                show_state: true
                color: state

          - type: markdown
            content: >-
              {% if not has_value('binary_sensor.owlet_sock_serial_number_verouderde_gegevens') %}
              Versheidsstatus niet beschikbaar. Controleer de entiteiten en de Owlet-app.
              {% elif state_attr('binary_sensor.owlet_sock_serial_number_verouderde_gegevens', 'poll_success') is false %}
              Cloudupdate mislukt. De waarden bevestigen de huidige apparaatstatus niet.
              {% elif state_attr('binary_sensor.owlet_sock_serial_number_verouderde_gegevens', 'freshness_enabled') is not true %}
              Versheidscontrole staat uit. De ouderdom van metingen wordt niet beoordeeld.
              {% elif is_state('binary_sensor.owlet_sock_serial_number_verouderde_gegevens', 'on') %}
              Metingen zijn verouderd of onbekend: {{ state_attr('binary_sensor.owlet_sock_serial_number_verouderde_gegevens', 'affected_readings') | join(', ') }}.
              {% else %}
              Brontijdstempels vallen binnen de ingestelde versheidslimiet.
              Oplopende cloudtijdstempels bewijzen geen actuele metingen.
              {% endif %}
          - type: markdown
            content: >-
              {% set last = as_datetime(states('sensor.owlet_sock_serial_number_laatste_meting'), none) %}
              **Verouderde gegevens.** Geen nieuwe meting van de Owlet-cloud sinds
              {{ as_local(last).strftime('%H:%M') if last else 'onbekend' }}.
              Kijk in de Owlet-app.
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_verouderde_gegevens
                state: "on"
            grid_options:
              columns: full

          - type: tile
            entity: sensor.owlet_sock_serial_number_hartslag
            name: Hartslag
            icon: mdi:heart-pulse
            color: red
            vertical: true
            features:
              - type: trend-graph
                hours_to_show: 6
                detail: true

          - type: tile
            entity: sensor.owlet_sock_serial_number_o2_saturatie
            name: Zuurstof
            icon: mdi:lungs
            color: light-blue
            vertical: true
            features:
              - type: trend-graph
                hours_to_show: 6
                detail: true

          - type: tile
            entity: sensor.owlet_sock_serial_number_slaaptoestand
            name: Slaap
            icon: mdi:sleep
            color: purple

          - type: tile
            entity: sensor.owlet_sock_serial_number_o2_saturatie_gemiddelde_10_minuten
            name: O₂ gemiddelde
            icon: mdi:chart-timeline-variant
            color: light-blue

      - type: grid
        cards:
          - type: heading
            heading: Comfort
            icon: mdi:thermometer

          - type: tile
            entity: sensor.owlet_sock_serial_number_huidtemperatuur
            name: Huidtemperatuur
            icon: mdi:thermometer
            color: orange
            vertical: true
            features:
              - type: trend-graph
                hours_to_show: 6
                detail: true

          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_wakker
            name: Wakker
            icon: mdi:eye-outline
            color: amber

      - type: grid
        cards:
          - type: heading
            heading: Sok
            icon: mdi:sock
            badges:
              - type: entity
                entity: sensor.owlet_sock_serial_number_batterijniveau
                icon: mdi:battery
                show_state: true
                color: state

          - type: tile
            entity: sensor.owlet_sock_serial_number_batterijniveau
            name: Batterij
            icon: mdi:battery
            color: green
            features:
              - type: trend-graph
                hours_to_show: 12
                detail: false

          - type: tile
            entity: sensor.owlet_sock_serial_number_resterende_batterijduur
            name: Resterende batterijduur
            icon: mdi:timer-outline
            color: green

          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_opladen
            name: Sok wordt opgeladen
            icon: mdi:battery-charging
            color: green
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_opladen
                state: "on"

          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_sok_uit
            name: Sok is uit
            icon: mdi:sock
            color: orange
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_sok_uit
                state: "on"


      - type: grid
        cards:
          - type: heading
            heading: Meldingen
            icon: mdi:shield-check-outline

          - type: markdown
            content: >-
              {% set alerts = ['binary_sensor.owlet_sock_serial_number_alarm_kritiek_zuurstofgehalte', 'binary_sensor.owlet_sock_serial_number_alarm_laag_zuurstofgehalte', 'binary_sensor.owlet_sock_serial_number_alarm_hoog_zuurstofgehalte', 'binary_sensor.owlet_sock_serial_number_alarm_hoge_hartslag', 'binary_sensor.owlet_sock_serial_number_alarm_lage_hartslag', 'binary_sensor.owlet_sock_serial_number_alarm_sok_niet_verbonden', 'binary_sensor.owlet_sock_serial_number_alarm_stroomuitval', 'binary_sensor.owlet_sock_serial_number_alarm_lage_batterij', 'binary_sensor.owlet_sock_serial_number_alarm_kritieke_batterij'] %}
              {% set ns = namespace(unknown=false, active=false) %}
              {% for entity in alerts %}
                {% if states(entity) not in ['on', 'off'] %}{% set ns.unknown = true %}{% endif %}
                {% if is_state(entity, 'on') %}{% set ns.active = true %}{% endif %}
              {% endfor %}
              {% if ns.unknown %}Sommige alarmstatussen zijn onbekend of niet beschikbaar. Controleer de Owlet-app.{% endif %}
              {% if ns.active %}Owlet meldt actieve alarmen. Dit zijn cloudgebeurtenissen.{% endif %}
              {% if not ns.unknown and not ns.active %}Alle geselecteerde cloudalarmvlaggen staan uit. Dit bewijst geen actuele bewaking.{% endif %}
          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_alarm_kritiek_zuurstofgehalte
            name: Kritiek zuurstofgehalte
            icon: mdi:lungs
            color: red
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_alarm_kritiek_zuurstofgehalte
                state: "on"

          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_alarm_laag_zuurstofgehalte
            name: Laag zuurstofgehalte
            icon: mdi:lungs
            color: red
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_alarm_laag_zuurstofgehalte
                state: "on"

          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_alarm_hoog_zuurstofgehalte
            name: Hoog zuurstofgehalte
            icon: mdi:lungs
            color: orange
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_alarm_hoog_zuurstofgehalte
                state: "on"

          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_alarm_hoge_hartslag
            name: Hoge hartslag
            icon: mdi:heart-alert
            color: red
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_alarm_hoge_hartslag
                state: "on"

          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_alarm_lage_hartslag
            name: Lage hartslag
            icon: mdi:heart-alert
            color: red
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_alarm_lage_hartslag
                state: "on"

          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_alarm_sok_niet_verbonden
            name: Sok niet verbonden
            icon: mdi:wifi-off
            color: orange
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_alarm_sok_niet_verbonden
                state: "on"

          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_alarm_stroomuitval
            name: Stroomuitval
            icon: mdi:power-plug-off
            color: red
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_alarm_stroomuitval
                state: "on"

          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_alarm_lage_batterij
            name: Batterij bijna leeg
            icon: mdi:battery-alert
            color: orange
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_alarm_lage_batterij
                state: "on"

          - type: tile
            entity: binary_sensor.owlet_sock_serial_number_alarm_kritieke_batterij
            name: Batterij kritiek
            icon: mdi:battery-alert-variant-outline
            color: red
            visibility:
              - condition: state
                entity: binary_sensor.owlet_sock_serial_number_alarm_kritieke_batterij
                state: "on"


  - title: Historie
    path: trends
    icon: mdi:chart-line
    type: sections
    max_columns: 2

    sections:

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Afgelopen 12 uur
            icon: mdi:heart-pulse
            badges:
              - type: entity
                entity: sensor.owlet_sock_serial_number_hartslag
                icon: mdi:heart-pulse
                show_state: true
                color: red

              - type: entity
                entity: sensor.owlet_sock_serial_number_o2_saturatie
                icon: mdi:lungs
                show_state: true
                color: light-blue

          - type: history-graph
            title: Hartslag
            hours_to_show: 12
            entities:
              - entity: sensor.owlet_sock_serial_number_hartslag
                name: Hartslag
            grid_options:
              columns: full

          - type: history-graph
            title: Zuurstof
            hours_to_show: 12
            entities:
              - entity: sensor.owlet_sock_serial_number_o2_saturatie
                name: O₂
              - entity: sensor.owlet_sock_serial_number_o2_saturatie_gemiddelde_10_minuten
                name: Gemiddelde 10 min
            grid_options:
              columns: full

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Slaap
            icon: mdi:sleep

          - type: history-graph
            title: Slaapstatus
            hours_to_show: 12
            entities:
              - entity: sensor.owlet_sock_serial_number_slaaptoestand
                name: Slaap
              - entity: binary_sensor.owlet_sock_serial_number_wakker
                name: Wakker
              - entity: binary_sensor.owlet_sock_serial_number_sok_uit
                name: Sok uit
            grid_options:
              columns: full

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Temperatuur
            icon: mdi:thermometer

          - type: history-graph
            title: Huidtemperatuur
            hours_to_show: 12
            entities:
              - entity: sensor.owlet_sock_serial_number_huidtemperatuur
                name: Huidtemperatuur
            grid_options:
              columns: full

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Per dag
            icon: mdi:chart-timeline-variant

          - type: statistics-graph
            title: Hartslag per dag
            period: day
            days_to_show: 30
            chart_type: line
            stat_types: [min, mean, max]
            entities:
              - entity: sensor.owlet_sock_serial_number_hartslag
                name: Hartslag
            grid_options:
              columns: full

          - type: statistics-graph
            title: Zuurstof per dag
            period: day
            days_to_show: 30
            chart_type: line
            stat_types: [min, mean, max]
            entities:
              - entity: sensor.owlet_sock_serial_number_o2_saturatie
                name: O₂
            grid_options:
              columns: full

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Batterij
            icon: mdi:battery
            badges:
              - type: entity
                entity: sensor.owlet_sock_serial_number_batterijniveau
                icon: mdi:battery
                show_state: true
                color: state

              - type: entity
                entity: sensor.owlet_sock_serial_number_resterende_batterijduur
                icon: mdi:timer-outline
                show_state: true

          - type: history-graph
            title: Batterij, afgelopen 48 uur
            hours_to_show: 48
            entities:
              - entity: sensor.owlet_sock_serial_number_batterijniveau
                name: Batterij
            grid_options:
              columns: full

      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: |
              **Owlet in Home Assistant**

              Dit is geen medisch toestel. De gegevens komen via de Owlet-cloud
              binnen en kunnen vertraagd zijn of zonder waarschuwing stoppen.

              Gebruik voor Owlet-alarmen altijd de officiële Owlet-app en het basisstation.

  - title: Bediening
    path: controls
    cards:
      - type: markdown
        content: Optionele bediening van het basisstation. Cloudacceptatie en teruggelezen status bewijzen de fysieke toestand niet.
      - type: tile
        entity: switch.owlet_sock_serial_number_basisstation_aan
        name: Basisstation
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
